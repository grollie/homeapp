<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Hub</title>
<meta name="description" content="Family dashboard for every smart device in the house.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23e8a33d' d='M12 3 2 12h3v8h5v-5h4v5h5v-8h3z'/></svg>">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1b1f24;--muted:#5f6670;--line:#dfe3e8;--accent:#e8a33d;--accent-ink:#1b1f24;--danger:#c0392b;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121417;--panel:#1c2026;--text:#e9ecef;--muted:#99a1ab;--line:#2c323a;--shadow:0 1px 3px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#121417;--panel:#1c2026;--text:#e9ecef;--muted:#99a1ab;--line:#2c323a;--shadow:0 1px 3px rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.card h1{margin:0 0 4px;font-size:24px}
.card p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.btn{display:inline-block;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.block{width:100%;margin-top:18px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px}
/* app */
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header .who{color:var(--muted);font-size:14px}
main{padding:16px;max-width:1200px;margin:0 auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-height:110px}
.tile:hover{border-color:var(--accent)}
.tile .ic{font-size:26px;line-height:1}
.tile .nm{font-weight:600}
.tile .sub{font-size:12px;color:var(--muted)}
.tile .badge{font-size:11px;color:var(--muted);margin-top:auto}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
/* viewer */
#viewer{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
#viewer .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#viewer .bar .t{font-weight:600;flex:1}
#viewer iframe{flex:1;border:0;width:100%;background:#fff}
#vnote{padding:14px 16px;font-size:14px;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line)}
#vcreds{padding:10px 16px;font-size:14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
#vcreds code{background:var(--bg);padding:2px 6px;border-radius:4px;user-select:all}
#vcreds code.masked{cursor:pointer;letter-spacing:1px;user-select:none}
#vcreds code.masked.shown{user-select:all;letter-spacing:0}
#vcreds span .btn.small{margin-left:4px;padding:2px 8px;font-size:12px}
#vcreds .rot{color:var(--muted);font-size:13px}#vcreds .rot.due{color:var(--danger);font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
#pwform{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
#pwform input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);min-width:180px}
#pwform .msg{font-size:13px;color:var(--muted)}
#vlive{flex:1;overflow:auto;padding:16px;max-width:900px;width:100%;margin:0 auto}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.ctl h3{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#999;display:inline-block}
.dot.on{background:#2e8b57}.dot.off{background:var(--danger)}
.ctl .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.zone{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.zone .zn{flex:1;min-width:140px}
.zone .zl{font-size:12px;color:var(--muted)}
.zone select,.zone button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.zone button.run{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.zone button:disabled{opacity:.4;cursor:not-allowed}
.ctl .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ctl .acts button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
.ctl .msg{font-size:13px;margin-top:8px;color:var(--muted)}
.ctl.sum{border-color:var(--accent)}
.ctl.alert{border:2px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.ctl.alert h3 .dot{background:var(--danger)}
.alertbox{background:var(--danger);color:#fff;font-weight:600;padding:10px 12px;border-radius:8px;margin:4px 0 10px}
.mppts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mppt{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.mppt b{color:var(--text)}
.mppt.dead{border-color:var(--danger);color:var(--danger)}.mppt.dead b{color:var(--danger)}
/* thermostat cards, after the ecobee portal: big current temp, setpoints, mode colour, sensor list */
.tstat{--m:#8a929c}.tstat.heat{--m:#e8702a}.tstat.cool{--m:#2f8be6}.tstat.auto{--m:#2e8b57}
.tstat{border-left:5px solid var(--m)}
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mode{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--m);padding:3px 10px;border-radius:999px}
.tbody{display:grid;grid-template-columns:auto auto 1fr;gap:18px;align-items:center;margin-top:10px}
.cur{font-size:56px;font-weight:300;line-height:1;letter-spacing:-2px}
.sps{font-size:28px;font-weight:500;line-height:1.2;white-space:nowrap}
.sp.heat{color:#e8702a}.sp.cool{color:#2f8be6}.sp.off{color:var(--muted)}.sep{color:var(--muted);margin:0 4px}
.curl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.tmeta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.hold{color:var(--accent);font-weight:600}.hold.muted{color:var(--muted);font-weight:400}
.sensors{margin-top:12px;border-top:1px solid var(--line)}
.sensor{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sensor.unused{opacity:.5}
.st2{display:flex;align-items:center;gap:10px}.stemp{min-width:36px;text-align:right;font-weight:600}
.occ{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}.occ.on{background:#2e8b57;box-shadow:0 0 0 3px rgba(46,139,87,.25)}
.door{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:#2e8b57}.door.open{background:var(--danger)}
.src{font-size:12px;color:var(--muted);text-align:right;padding:4px 2px}
.connect p.muted{color:var(--muted);font-size:14px;margin:4px 0 10px}
.connect input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:200px;font-size:16px;letter-spacing:2px}
.connect button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
@media (max-width:520px){.tbody{grid-template-columns:auto 1fr}.tmeta{grid-column:1/-1}.cur{font-size:44px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}
.st{background:var(--bg);border-radius:10px;padding:10px 12px}
.st .sv{font-size:20px;font-weight:600;line-height:1.2}.st .sl{font-size:12px;color:var(--muted)}
.st.pv .sv{color:var(--accent)}.st.soc .sv{color:#2e8b57}.st.run .sv{color:#4a90d9}
/* compact battery chips: fill bar behind the %; wraps to fit any number */
.bstrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bstrip:empty{display:none}
.bchip{position:relative;overflow:hidden;display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:13px;min-width:84px}
.bchip i{position:absolute;left:0;top:0;bottom:0;background:#2e8b57;opacity:.22}
.bchip.mid i{background:var(--accent)}.bchip.low i{background:var(--danger)}
.bchip b{position:relative;font-size:15px}.bchip small{position:relative;color:var(--muted);font-size:11px}
.bchip.off{opacity:.45}
.bchip.odd{border-color:var(--danger)}
.bsum{align-self:center;font-size:12px;color:var(--muted);padding-left:4px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:96px;padding:12px}}
</style>
</head>
<body>

<section id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>Home Hub</h1>
    <p>Sign in to see the family's devices.</p>
    <label for="u">Name</label>
    <input id="u" name="username" autocomplete="username" required autocapitalize="off">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary block" type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <h1>Home Hub</h1>
    <span class="who" id="who"></span>
    <a class="btn" href="setup.html" title="Add or change family logins and devices">Accounts</a>
    <button class="btn" id="lockBtn">Sign out</button>
  </header>
  <main id="main"></main>
</section>

<section id="viewer" class="hidden">
  <div class="bar">
    <button class="btn" id="backBtn">← Back</button>
    <span class="t" id="vtitle"></span>
    <a class="btn" href="https://passwords.google.com/" target="_blank" rel="noopener" title="Look up this device's login in Google Password Manager">🔑 Passwords</a>
    <a class="btn" id="vopen" target="_blank" rel="noopener">Open in new tab ↗</a>
  </div>
  <div id="vcreds" class="hidden"></div>
  <div id="vnote" class="hidden"></div>
  <div id="vlive" class="hidden"></div>
  <iframe id="frame" title="Device portal" allow="fullscreen; camera; microphone; geolocation" referrerpolicy="no-referrer"></iframe>
</section>

<script src="crypto.js"></script>
<script src="vault.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const vault = window.HH_VAULT;
let data = null, rawKey = null;

if (!vault) {
  $('#loginErr').textContent = 'No vault.js found yet. Open setup.html to create one.';
  $('#loginBtn').disabled = true;
}

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Checking…';
  $('#loginErr').textContent = '';
  try {
    rawKey = await HH.unlockKey(vault, $('#u').value, $('#p').value);
    data = await HH.readData(vault, rawKey);
    sessionStorage.setItem('hh', JSON.stringify({ name: $('#u').value.trim(), key: HH.b64(rawKey) }));
    show(); openFromHash();
  } catch {
    $('#loginErr').textContent = 'Wrong name or password.';
  } finally { btn.disabled = false; btn.textContent = 'Sign in'; $('#p').value = ''; }
});

// Stay signed in for this browser tab only.
(async () => {
  try {
    const s = JSON.parse(sessionStorage.getItem('hh'));
    if (s && vault) { rawKey = HH.unb64(s.key); data = await HH.readData(vault, rawKey); $('#u').value = s.name; show(); openFromHash(); }
  } catch { sessionStorage.removeItem('hh'); }
})();

$('#lockBtn').onclick = () => { sessionStorage.removeItem('hh'); location.reload(); };

function show() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = $('#u').value.trim();
  const main = $('#main'); main.innerHTML = '';
  const groups = {};
  for (const d of data.devices) (groups[d.group || 'Devices'] ||= []).push(d);
  for (const [g, list] of Object.entries(groups)) {
    const h = document.createElement('h2'); h.className = 'sec'; h.textContent = g; main.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid'; main.appendChild(grid);
    for (const d of list) {
      const b = document.createElement('button'); b.className = 'tile';
      b.innerHTML = `<span class="ic">${d.icon || '🔌'}</span><span class="nm"></span><span class="sub"></span><span class="badge"></span>`;
      b.querySelector('.nm').textContent = d.name;
      b.querySelector('.sub').textContent = d.sub || '';
      b.querySelector('.badge').textContent = d.app ? 'App only' : (d.embed === false ? 'Opens in new tab' : 'Web portal');
      b.onclick = () => openDevice(d);
      grid.appendChild(b);
    }
  }
}

function openDevice(d) {
  $('#vtitle').textContent = d.name;
  $('#vopen').href = d.url || '#';
  const creds = $('#vcreds'); creds.innerHTML = '';
  if (d.login) {
    creds.classList.remove('hidden');
    creds.innerHTML = `<span>Login for this device:</span>`;
    for (const [k, v] of Object.entries(d.login)) {
      const secret = /pass|token|secret|key|pin/i.test(k);
      const s = document.createElement('span'); s.innerHTML = `${k}: <code></code>`;
      const code = s.querySelector('code');
      if (secret) {
        code.textContent = '••••••••'; code.className = 'masked'; code.title = 'Click to show';
        code.onclick = () => { const on = code.classList.toggle('shown'); code.textContent = on ? v : '••••••••'; code.title = on ? 'Click to hide' : 'Click to show'; };
        const cp = document.createElement('button'); cp.className = 'btn small'; cp.textContent = 'Copy'; cp.title = `Copy ${k}`;
        cp.onclick = () => navigator.clipboard.writeText(v).then(() => { cp.textContent = 'Copied'; setTimeout(() => (cp.textContent = 'Copy'), 1500); });
        s.appendChild(cp);
      } else code.textContent = v;
      creds.appendChild(s);
    }
    if (d.rotateDays) {
      const due = (d.loginUpdated || 0) + d.rotateDays * 864e5, left = Math.ceil((due - Date.now()) / 864e5);
      const s = document.createElement('span'); s.className = 'rot' + (left <= 3 ? ' due' : '');
      s.textContent = d.loginUpdated ? (left < 0 ? `Password expired ${-left} days ago` : left === 0 ? 'Password expires today' : `Password expires in ${left} days`) + ` (changes every ${d.rotateDays} days)` : `Password changes every ${d.rotateDays} days`;
      creds.appendChild(s);
    }
    const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'Update password'; b.onclick = () => updatePassword(d); creds.appendChild(b);
    const form = document.createElement('div'); form.id = 'pwform'; form.className = 'hidden'; creds.appendChild(form);
  } else creds.classList.add('hidden');
  const note = $('#vnote');
  if (d.app) {
    note.classList.remove('hidden');
    note.textContent = d.note || `${d.name} only works through its phone app. Use the button above to open its website.`;
  } else if (d.embed === false) {
    note.classList.remove('hidden');
    note.textContent = d.note || `${d.name} doesn't allow being shown inside another page. Use "Open in new tab".`;
  } else note.classList.add('hidden');
  const f = $('#frame'), live = $('#vlive'); live.innerHTML = '';
  if (d.rachioKey || d.solarKey || d.climateRelay) {
    live.classList.remove('hidden'); f.classList.add('hidden'); f.src = 'about:blank'; note.classList.add('hidden');
    if (d.rachioKey) rachioPanel(d.rachioKey, live); else if (d.climateRelay) climatePanel(d, live); else solarPanel(d, live);
  }
  else if (d.url && !d.app && d.embed !== false) { live.classList.add('hidden'); f.classList.remove('hidden'); f.src = d.url; }
  else { live.classList.add('hidden'); f.classList.add('hidden'); f.src = 'about:blank'; }
  $('#viewer').classList.remove('hidden');
  const hash = '#' + encodeURIComponent(d.name);
  if (location.hash !== hash) history.pushState({ v: 1 }, '', hash);
  else if (!history.state) history.replaceState({ v: 1, direct: true }, '', hash);   // landed here directly: no entry to go back to
}
function closeViewer() { $('#viewer').classList.add('hidden'); $('#frame').src = 'about:blank'; $('#vlive').innerHTML = ''; clearInterval(solarTimer); clearInterval(climateTimer); }
// Back: always close in place and drop the #tile from the address — never rely on browser history,
// which leaves the site when there is no earlier entry (direct link, reload, hard refresh).
function goBack() { history.replaceState(null, '', location.pathname + location.search); closeViewer(); }
// Reopen a tile when the page loads (or is reloaded) with #Name in the address.
function openFromHash() {
  const name = decodeURIComponent(location.hash.slice(1));
  const d = name && data && data.devices.find((x) => x.name === name);
  if (d) openDevice(d); else closeViewer();
}

// ---- Solar Assistant merged panel (both sites, via the relay worker in relay/worker.js) ----
let solarTimer = null;
async function solarPanel(d, root) {
  clearInterval(solarTimer);
  const relay = d.solarRelay, key = d.solarKey;
  const kW = (w) => (Math.abs(w) >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W');
  const stat = (label, val, cls = '') => `<div class="st ${cls}"><div class="sv">${val}</div><div class="sl">${label}</div></div>`;
  const row = (pv, load, soc, batt, grid, socLabel = 'Battery') => stat('Solar', kW(pv), 'pv') + stat('Load', kW(load)) + stat(socLabel, `${soc.toFixed(0)}%`, 'soc') +
    stat(batt >= 0 ? 'Charging' : 'Discharging', kW(Math.abs(batt))) + stat(grid >= 0 ? 'From grid' : 'To grid', kW(Math.abs(grid)));
  root.innerHTML = '<div class="ctl">Connecting to Solar Assistant…</div>';
  let built = false;

  // Smart Life (Tuya) batteries, shown as a compact strip under the site they belong to.
  // d.batteries maps site name -> list of device ids or name fragments; unmatched ones go in a "Batteries" strip at the bottom.
  const kWs = (w) => (Math.abs(w) >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W');
  // One chip per battery: fill bar = SOC. Label is its position in the group (B1…), tooltip has the Smart Life name.
  // "?" marks a battery whose SOC or voltage disagrees with the rest of its group (wrong grouping or a sick pack).
  const chip = (b, i, group) => {
    const soc = b.soc ?? null, cls = soc == null ? '' : soc < 20 ? ' low' : soc < 50 ? ' mid' : ' ok';
    const med = (arr) => { const s = arr.filter((x) => x != null).sort((a, c) => a - c); return s.length ? s[Math.floor(s.length / 2)] : null; };
    const odd = b.online && group.length > 1 && (Math.abs(soc - med(group.map((x) => x.soc))) >= 3 || Math.abs(b.volts - med(group.map((x) => x.volts))) >= 0.3);
    const tip = `${b.name}${b.online ? '' : ' (offline)'}${b.error ? ' — ' + b.error : ''}\n${b.volts ?? '—'} V · ${b.amps ?? '—'} A · ${kWs(b.watts || 0)} ${b.watts > 0 ? 'charging' : 'discharging'}\nhealth ${b.soh ?? '—'}% · ${b.cycles ?? '—'} cycles · ${b.temp ?? '—'} °C${odd ? '\n⚠ reading differs from the rest of this group' : ''}`;
    return `<span class="bchip${b.online ? '' : ' off'}${cls}${odd ? ' odd' : ''}" title="${tip.replace(/"/g, '&quot;')}"><i style="width:${soc ?? 0}%"></i><b>${soc == null ? '—' : soc + '%'}</b><small>B${i + 1}${odd ? ' ?' : ''}</small></span>`;
  };
  const strip = (bats) => {
    if (!bats.length) return '';
    const w = bats.reduce((a, b) => a + (b.watts || 0), 0), socs = bats.filter((b) => b.soc != null);
    const avg = socs.length ? socs.reduce((a, b) => a + b.soc, 0) / socs.length : null;
    return bats.map((b, i) => chip(b, i, bats)).join('') + `<span class="bsum">${bats.length} packs · ${avg == null ? '—' : avg.toFixed(0) + '%'} · ${kWs(Math.abs(w))} ${w >= 0 ? 'in' : 'out'}</span>`;
  };
  const fetchBatteries = async () => {
    if (!d.tuyaRelay) return null;
    const r = await fetch(`${d.tuyaRelay.replace(/\/$/, '')}/devices?k=${encodeURIComponent(key)}`);
    if (!r.ok) return null;
    return (await r.json()).devices || [];
  };
  // d.batteries: { "<site name>": [device ids or name fragments] }. Ids keep the order given, so B1…Bn are stable.
  const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const forSite = (bats, site) => {
    const want = (d.batteries || {})[site.name] || (d.batteries || {})[site.description] || [];
    if (want.length) return want.map((w) => bats.find((b) => b.id === w) || bats.find((b) => norm(b.name).includes(norm(w)))).filter(Boolean);
    return site.description ? bats.filter((b) => norm(b.name).includes(norm(site.description))) : [];
  };

  const refresh = async () => {
    const r = await fetch(`${relay.replace(/\/$/, '')}/metrics?k=${encodeURIComponent(key)}`);
    if (!r.ok) throw new Error('relay ' + r.status);
    const [{ sites }, bats] = await Promise.all([r.json(), fetchBatteries().catch(() => null)]);
    if (!built) {
      root.innerHTML = '<div class="ctl sum"><h3>☀️ Both systems</h3><div class="stats"></div></div>' + sites.map((s) =>
        `<div class="ctl site"><h3><span class="dot"></span><span></span></h3><div class="meta"></div><div class="alertbox hidden"></div><div class="stats"></div><div class="mppts"></div><div class="bstrip"></div><div class="acts"><a class="btn small" target="_blank" rel="noopener">Full dashboard ↗</a></div></div>`).join('') +
        '<div class="ctl extra hidden"><h3>🔋 Batteries</h3><div class="bstrip"></div></div>';
      built = true;
    }
    // Runtime at the current draw: usable Wh in the packs / watts leaving them. null = nothing known / not discharging.
    // Usable = remaining minus the reserve the inverters stop at (d.reserveSoc, default 5%), per pack.
    const reserve = d.reserveSoc ?? 5;
    const runtime = (packs) => {
      const live = packs.filter((b) => b.online && b.remainAh != null && b.capAh);
      if (!live.length) return null;
      const wh = live.reduce((a, b) => a + Math.max(0, b.remainAh - b.capAh * reserve / 100) * b.volts, 0);
      const out = live.reduce((a, b) => a + Math.max(0, -(b.watts || 0)), 0);
      return { wh, out, hours: out > 0 ? wh / out : Infinity };
    };
    const fmtRun = (r) => !r ? null : r.hours === Infinity ? 'Charging' : r.hours >= 48 ? `${(r.hours / 24).toFixed(1)} d` : `${Math.floor(r.hours)}h ${Math.round((r.hours % 1) * 60)}m`;
    const runs = [];
    if (bats) {
      const used = new Set();
      sites.forEach((s, i) => { const mine = forSite(bats, s); mine.forEach((b) => used.add(b.id)); runs[i] = runtime(mine); root.querySelectorAll('.ctl.site .bstrip')[i].innerHTML = strip(mine); });
      const rest = bats.filter((b) => !used.has(b.id));
      const ex = root.querySelector('.ctl.extra'); ex.classList.toggle('hidden', !rest.length); ex.querySelector('.bstrip').innerHTML = strip(rest);
    }
    const tot = { pv: 0, load: 0, grid: 0, batt: 0, soc: [] }, faults = [];
    sites.forEach((s, i) => {
      const el = root.querySelectorAll('.ctl.site')[i];
      el.querySelector('h3 span:last-child').textContent = s.description ? `${s.description} (${s.name})` : s.name;
      el.querySelector('a').href = s.dashboard;
      if (s.error) { el.querySelector('.dot').className = 'dot off'; el.querySelector('.meta').textContent = 'Offline — ' + s.error; return; }
      const m = Object.fromEntries(s.metrics.map((x) => [x.topic, x]));
      const v = (t) => +((m[t] || {}).value) || 0;
      const pv = v('total/pv_power'), load = v('total/load_power'), grid = v('total/grid_power'), batt = v('total/battery_power'), soc = v('total/battery_state_of_charge');
      tot.pv += pv; tot.load += load; tot.grid += grid; tot.batt += batt; tot.soc.push(soc);
      el.querySelector('.dot').className = 'dot on';
      el.querySelector('.meta').textContent = `Updated ${new Date().toLocaleTimeString()}${m['inverter_1/device_mode'] ? ' · ' + m['inverter_1/device_mode'].value : ''}${m['total/capacity'] ? ' · ' + m['total/capacity'].value + ' kWh battery' : ''}`;
      const rt = fmtRun(runs[i]);
      // MPPT strings: one at ~0 while the other is producing means a string/breaker/connector fault.
      const mppts = Object.keys(m).filter((t) => /^inverter_\d+\/pv_power_\d+$/.test(t)).sort().map((t) => ({ t, w: v(t), volts: v(t.replace('pv_power', 'pv_voltage')), amps: v(t.replace('pv_power', 'pv_current')) }));
      const fault = mppts.length > 1 && mppts.some((x) => x.w <= 5) && mppts.some((x) => x.w > 100);
      const mp = mppts.map((x, k) => { const dead = fault && x.w <= 5; return `<span class="mppt${dead ? ' dead' : ''}" title="${x.volts} V · ${x.amps} A">MPPT ${k + 1}: <b>${kW(x.w)}</b>${dead ? ' ⚠' : ''}</span>`; }).join('');
      el.querySelector('.stats').innerHTML = row(pv, load, soc, batt, grid) + (rt ? stat(`Runtime to ${reserve}%`, rt, 'run') : '');
      el.querySelector('.mppts').innerHTML = mp;
      el.classList.toggle('alert', fault);
      const box = el.querySelector('.alertbox'); box.classList.toggle('hidden', !fault);
      if (fault) {
        const dead = mppts.filter((x) => x.w <= 5).map((x) => 'MPPT ' + (mppts.indexOf(x) + 1)).join(' and ');
        const ok = mppts.filter((x) => x.w > 100).map((x) => 'MPPT ' + (mppts.indexOf(x) + 1) + ' is making ' + kW(x.w)).join(', ');
        box.textContent = `⚠ ${dead} reads 0 W while ${ok}. Check that string's breaker, fuse and connectors.`;
        faults.push(s.description || s.name);
      }
    });
    const soc = tot.soc.length ? tot.soc.reduce((a, b) => a + b, 0) / tot.soc.length : 0;
    // Banks aren't shared between sites, so the house runs until the first bank empties.
    const all = runs.filter(Boolean), rtAll = all.length ? fmtRun({ hours: Math.min(...all.map((r) => r.hours)) }) : null;
    root.querySelector('.sum .stats').innerHTML = row(tot.pv, tot.load, soc, tot.batt, tot.grid, 'Battery avg') + (rtAll ? stat(`Runtime to ${reserve}% (first bank)`, rtAll, 'run') : '');
  };
  try { await refresh(); } catch (e) { root.innerHTML = `<div class="ctl">Couldn't reach Solar Assistant (${e.message}).</div>`; return; }
  solarTimer = setInterval(() => { if ($('#viewer').classList.contains('hidden')) return clearInterval(solarTimer); refresh().catch(() => {}); }, 10000);
}

// ---- Thermostats (ecobee now; Home Assistant later) — the relay returns the same "climate shape" either way ----
let climateTimer = null;
async function climatePanel(d, root) {
  clearInterval(climateTimer);
  const deg = (x) => (x == null ? '—' : `${Math.round(x)}°`);
  const modeCls = { heat: 'heat', cool: 'cool', auto: 'auto', off: 'off' };
  root.innerHTML = '<div class="ctl">Connecting to the thermostats…</div>';
  const refresh = async () => {
    const r = await fetch(`${d.climateRelay.replace(/\/$/, '')}/thermostats?k=${encodeURIComponent(d.solarKey || d.climateKey)}`);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || 'relay ' + r.status);
    const { thermostats, source } = body;
    root.innerHTML = thermostats.map((t) => {
      const mode = (t.mode || 'off').toLowerCase(), cls = modeCls[mode] || 'off';
      const set = mode === 'auto' ? `<span class="sp heat">${deg(t.heatSet)}</span><span class="sep">–</span><span class="sp cool">${deg(t.coolSet)}</span>`
        : mode === 'heat' ? `<span class="sp heat">${deg(t.heatSet)}</span>` : mode === 'cool' ? `<span class="sp cool">${deg(t.coolSet)}</span>` : '<span class="sp off">Off</span>';
      const running = t.running.length ? t.running.map((x) => x.replace(/([a-z])([A-Z0-9])/g, '$1 $2').toLowerCase()).join(', ') : 'idle';
      const hold = t.hold ? `<div class="hold">Hold${t.hold.name && t.hold.name !== 'auto' ? ` · ${t.hold.name}` : ''}${t.hold.until ? ` until ${t.hold.until.replace(/:\d\d$/, '')}` : ''}</div>` : (t.climate ? `<div class="hold muted">Schedule · ${t.climate}</div>` : '');
      const sensors = t.sensors.map((s) => `<div class="sensor${s.inUse === false ? ' unused' : ''}"><span class="sn">${s.name}</span><span class="st2">${s.open != null ? `<b class="door ${s.open ? 'open' : 'closed'}">${s.open ? 'Open' : 'Closed'}</b>` : ''}${s.occupied != null ? `<i class="occ${s.occupied ? ' on' : ''}" title="${s.occupied ? 'Occupied' : 'No motion'}"></i>` : ''}<span class="stemp">${s.temp != null ? deg(s.temp) : ''}</span></span></div>`).join('');
      return `<div class="ctl tstat ${cls}${t.connected === false ? ' offline' : ''}">
        <div class="thead"><h3><span class="dot ${t.connected === false ? 'off' : 'on'}"></span><span>${t.name}</span></h3><span class="mode ${cls}">${mode === 'auto' ? 'Auto' : mode === 'heat' ? 'Heat' : mode === 'cool' ? 'Cool' : 'Off'}</span></div>
        <div class="tbody">
          <div class="big"><div class="cur">${deg(t.temp)}</div><div class="curl">Current</div></div>
          <div class="setp"><div class="sps">${set}</div><div class="curl">Set to</div></div>
          <div class="tmeta">
            <div>💧 ${t.humidity != null ? t.humidity + '%' : '—'} humidity</div>
            <div>🌀 Fan ${t.fan || '—'} · ${running}</div>
            ${t.outside ? `<div>🌤 Outside ${deg(t.outside.temp)}${t.outside.condition ? ' · ' + t.outside.condition : ''}</div>` : ''}
            ${hold}
          </div>
        </div>
        <div class="sensors">${sensors}</div>
      </div>`;
    }).join('') + `<div class="src">Source: ${source === 'ecobee' ? 'ecobee portal (unofficial)' : source} · ${new Date().toLocaleTimeString()}</div>`;
  };
  // One-time "Connect ecobee" for accounts with SMS 2-step: relay texts the code, user types it here once.
  const relay = d.climateRelay.replace(/\/$/, ''), key = encodeURIComponent(d.solarKey || d.climateKey);
  const connectBox = (msg) => {
    root.innerHTML = `<div class="ctl connect"><h3>Connect ecobee</h3><p class="muted">${msg}</p>
      <div class="acts"><button id="cstart">Text me the code</button><input id="ccode" inputmode="numeric" placeholder="6-digit code from the text" maxlength="8"><button id="cfinish" class="primary">Connect</button></div><div class="msg" id="cmsg"></div></div>`;
    const say = (t) => ($('#cmsg').textContent = t);
    $('#cstart').onclick = async () => { say('Sending…'); try { const r = await (await fetch(`${relay}/connect/start?k=${key}`)).json(); say(r.error ? r.error : r.sent ? `Code sent to ${r.to}. Type it below.` : r.note || 'Done'); if (r.connected) climatePanel(d, root); } catch (e) { say(e.message); } };
    $('#cfinish').onclick = async () => { say('Checking…'); try { const r = await (await fetch(`${relay}/connect/finish?k=${key}&code=${encodeURIComponent($('#ccode').value)}`)).json(); if (r.error) return say(r.error); say(r.refreshToken ? 'Connected — the relay will stay signed in.' : 'Connected for now (no refresh token; may need re-connecting later).'); setTimeout(() => climatePanel(d, root), 1200); } catch (e) { say(e.message); } };
  };
  try { await refresh(); } catch (e) {
    if (/2-step|Connect ecobee|mfa/i.test(e.message)) return connectBox('Your ecobee account uses SMS 2-step verification. Send the code once and the relay stays signed in.');
    root.innerHTML = `<div class="ctl">Couldn't reach the thermostats (${e.message}).</div>`; return;
  }
  climateTimer = setInterval(() => { if ($('#viewer').classList.contains('hidden')) return clearInterval(climateTimer); refresh().catch(() => {}); }, 30000);
}

// ---- Change a device password from the page and save it to the vault ----
function updatePassword(d) {
  const f = $('#pwform'); f.classList.toggle('hidden');
  if (!f.classList.contains('hidden') && !f.innerHTML) {
    f.innerHTML = `<input id="npw" type="password" placeholder="New password" autocomplete="new-password"><input id="ntok" type="password" placeholder="GitHub token (to publish)" autocomplete="off"><button class="btn small primary" id="npub">Save &amp; publish</button><button class="btn small" id="ndl">Save &amp; download</button><span class="msg" id="nmsg"></span>`;
    const save = async (publish) => {
      const pw = $('#npw').value, msg = $('#nmsg'); msg.textContent = '';
      if (!pw) return (msg.textContent = 'Type the new password first.');
      const token = $('#ntok').value.trim();
      if (publish && !token) return (msg.textContent = 'Paste a GitHub token, or use Save & download.');
      try {
        d.login.password = pw; d.loginUpdated = Date.now();
        const out = { v: vault.v, users: vault.users, data: await HH.writeData(rawKey, data) };
        const text = HH.vaultText(out);
        if (publish) { await HH.publishToGitHub(HH.REPO, token, text, `Update ${d.name} password`); msg.textContent = 'Saved. The site updates in a minute or two.'; }
        else { HH.download(text); msg.textContent = 'Downloaded vault.js — commit it to the homeapp repo.'; }
        window.HH_VAULT.data = out.data;     // keep this tab consistent until the site redeploys
        openDevice(d);
      } catch (e) { msg.textContent = e.message || e; }
      $('#ntok').value = '';
    };
    $('#npub').onclick = () => save(true); $('#ndl').onclick = () => save(false);
  }
}

// ---- Rachio live panel (public API, called straight from the browser) ----
async function rachioPanel(key, root) {
  const api = async (path, method = 'GET', body) => {
    const r = await fetch('https://api.rach.io/1/public/' + path, { method, headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
    if (!r.ok) throw new Error('Rachio ' + r.status);
    return r.status === 204 ? null : r.json();
  };
  const ago = (ms) => { if (!ms) return 'never'; const d = (Date.now() - ms) / 864e5; return d < 1 ? 'today' : d < 2 ? 'yesterday' : Math.floor(d) + ' days ago'; };
  root.innerHTML = '<div class="ctl">Loading Rachio…</div>';
  try {
    const me = await api('person/info'), person = await api('person/' + me.id);
    root.innerHTML = '';
    // Hide retired controllers: offline and nothing watered in the last year.
    const year = 365 * 864e5;
    const active = person.devices.filter((d) => d.status === 'ONLINE' || d.zones.some((z) => z.lastWateredDate > Date.now() - year));
    for (const dev of active) {
      const c = document.createElement('div'); c.className = 'ctl';
      const online = dev.status === 'ONLINE';
      const rain = dev.rainDelayExpirationDate > Date.now() ? ` · rain delay until ${new Date(dev.rainDelayExpirationDate).toLocaleString()}` : '';
      c.innerHTML = `<h3><span class="dot ${online ? 'on' : 'off'}"></span><span></span></h3><div class="meta">${online ? 'Online' : 'Offline'} · ${dev.model.replace('GENERATION', 'Gen ').replace('_', ' ').toLowerCase()}${rain}</div><div class="zones"></div><div class="acts"><button class="stop">Stop all watering</button><button class="rain">Rain delay 24h</button><button class="clear">Clear rain delay</button></div><div class="msg"></div>`;
      c.querySelector('h3 span:last-child').textContent = dev.name;
      const msg = c.querySelector('.msg');
      const say = async (fn, ok) => { try { await fn(); msg.textContent = ok; } catch (e) { msg.textContent = e.message; } };
      const zones = c.querySelector('.zones');
      for (const z of dev.zones.filter((z) => z.enabled).sort((a, b) => a.zoneNumber - b.zoneNumber)) {
        const row = document.createElement('div'); row.className = 'zone';
        row.innerHTML = `<div class="zn"><div></div><div class="zl">Zone ${z.zoneNumber} · last run ${ago(z.lastWateredDate)}</div></div><select>${[1, 3, 5, 10, 15, 20, 30].map((m) => `<option value="${m}"${m === 5 ? ' selected' : ''}>${m} min</option>`).join('')}</select><button class="run"${online ? '' : ' disabled'}>Run</button>`;
        row.querySelector('.zn div').textContent = z.name;
        row.querySelector('.run').onclick = () => { const m = +row.querySelector('select').value; say(() => api('zone/start', 'PUT', { id: z.id, duration: m * 60 }), `Running ${z.name} for ${m} min.`); };
        zones.appendChild(row);
      }
      c.querySelector('.stop').onclick = () => say(() => api('device/stop_water', 'PUT', { id: dev.id }), 'Stopped all watering.');
      c.querySelector('.rain').onclick = () => say(() => api('device/rain_delay', 'PUT', { id: dev.id, duration: 86400 }), 'Rain delay set for 24 hours.');
      c.querySelector('.clear').onclick = () => say(() => api('device/rain_delay', 'PUT', { id: dev.id, duration: 0 }), 'Rain delay cleared.');
      root.appendChild(c);
    }
  } catch (e) { root.innerHTML = `<div class="ctl">Couldn't reach Rachio (${e.message}). Use "Open in new tab".</div>`; }
}
$('#backBtn').onclick = goBack;
window.addEventListener('popstate', () => { if (!location.hash) closeViewer(); else openFromHash(); });
